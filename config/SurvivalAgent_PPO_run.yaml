# PPO run (tag=ppo)
# - If you prefer CLI --env, you can omit env_path below and pass --env Build/Island.exe
# - base_port MUST be unique per simultaneous run.

env_settings:
  #env_path: C:\project\RL\IslandSurvival.exe
  env_args: ["-tag", "ppo"]
  base_port: 5005
  num_envs: 4
  seed: 1

engine_settings:
  no_graphics: true
  time_scale: 20
  target_frame_rate: -1

behaviors:
  SurvivalAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 512
      buffer_size: 8192
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000

    keep_checkpoints: 5
    checkpoint_interval: 50000
