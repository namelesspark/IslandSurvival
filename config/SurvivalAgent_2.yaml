behaviors:
  SurvivalAgent:
    trainer_type: sac

    hyperparameters:
      batch_size: 512
      buffer_size: 50000
      learning_rate: 3.0e-4
      learning_rate_schedule: constant

      # SAC-specific
      buffer_init_steps: 5000
      init_entcoef: 0.5
      tau: 0.005
      steps_per_update: 10

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000

    keep_checkpoints: 5
    checkpoint_interval: 50000
